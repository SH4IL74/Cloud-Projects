<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serverless Password Vault</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🔐 Serverless Password Vault</h1>
      <p class="subtitle">Powered by AWS Lambda, DynamoDB & API Gateway</p>
    </header>

    <main class="grid">
      <!-- Generator Card -->
      <section class="card">
        <h2>Generate Password</h2>
        <form id="vault-form">
          <div class="form-group">
            <label for="label">Secret Label / Account Name</label>
            <input type="text" id="label" placeholder="e.g. GitHub Admin, Database Root" required />
          </div>

          <div class="form-group">
            <div class="range-header">
              <label for="length">Password Length: <span id="length-val">16</span></label>
            </div>
            <input type="range" id="length" min="8" max="64" value="16" />
          </div>

          <div class="checkbox-group">
            <label><input type="checkbox" id="use_uppercase" checked /> Uppercase (A-Z)</label>
            <label><input type="checkbox" id="use_digits" checked /> Digits (0-9)</label>
            <label><input type="checkbox" id="use_symbols" checked /> Symbols (!@#$...)</label>
          </div>

          <button type="submit" id="generate-btn">Generate & Save</button>
        </form>

        <div id="result-box" class="result-box hidden">
          <label>Generated Secret</label>
          <div class="secret-display">
            <input type="text" id="generated-pwd" readonly />
            <button id="copy-btn" title="Copy to clipboard">📋</button>
          </div>
          <span id="strength-badge" class="badge"></span>
        </div>
      </section>

      <!-- Stored Records Card -->
      <section class="card">
        <div class="card-header">
          <h2>Vault Audit Records</h2>
          <button id="refresh-btn" class="btn-secondary">🔄 Refresh</button>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Label</th>
                <th>Length</th>
                <th>Strength</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="records-body">
              <tr>
                <td colspan="4" class="loading-cell">Loading records...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
